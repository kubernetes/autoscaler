suite: admission controller clusterrole - rbac.create
templates:
  - admission-controller-clusterrole.yaml
tests:
  - it: renders the clusterrole by default (admission controller enabled, rbac.create true)
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ClusterRole

  - it: does not render the clusterrole when rbac.create is false
    set:
      rbac.create: false
    asserts:
      - hasDocuments:
          count: 0

  - it: does not render the clusterrole when admission controller is disabled
    set:
      admissionController.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: does not render the clusterrole when both admission controller and rbac.create are false
    set:
      admissionController.enabled: false
      rbac.create: false
    asserts:
      - hasDocuments:
          count: 0
