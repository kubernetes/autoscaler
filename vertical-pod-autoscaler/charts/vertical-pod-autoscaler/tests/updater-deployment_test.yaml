suite: updater deployment and rbac - leader election
templates:
  - updater-deployment.yaml
  - updater-role.yaml
  - updater-rolebinding.yaml
tests:
  - it: enables leader election with chart defaults (default replicas is 2)
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --leader-elect=true
        template: updater-deployment.yaml
      - hasDocuments:
          count: 1
        template: updater-role.yaml
      - hasDocuments:
          count: 1
        template: updater-rolebinding.yaml

  - it: does not enable leader election when replicas is 1 and leaderElection.enabled is not set
    set:
      updater.replicas: 1
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --leader-elect=true
        template: updater-deployment.yaml
      # count: 0 means the template renders nothing (no Role/RoleBinding is created)
      - hasDocuments:
          count: 0
        template: updater-role.yaml
      - hasDocuments:
          count: 0
        template: updater-rolebinding.yaml

  - it: does not enable leader election when leaderElection.enabled is false, even with replicas > 1
    set:
      updater.replicas: 3
      updater.leaderElection.enabled: false
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --leader-elect=true
        template: updater-deployment.yaml
      - hasDocuments:
          count: 0
        template: updater-role.yaml
      - hasDocuments:
          count: 0
        template: updater-rolebinding.yaml

  - it: enables leader election when leaderElection.enabled is true, even with replicas = 1
    set:
      updater.replicas: 1
      updater.leaderElection.enabled: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --leader-elect=true
        template: updater-deployment.yaml
      - hasDocuments:
          count: 1
        template: updater-role.yaml
      - hasDocuments:
          count: 1
        template: updater-rolebinding.yaml

  - it: does not create leader-locking RBAC when rbac.create is false (user supplies their own RBAC)
    set:
      rbac.create: false
    asserts:
      - hasDocuments:
          count: 0
        template: updater-role.yaml
      - hasDocuments:
          count: 0
        template: updater-rolebinding.yaml

  - it: appends updater.extraEnv to the updater container env
    set:
      updater.extraEnv:
        - name: GOMAXPROCS
          value: "2"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GOMAXPROCS
            value: "2"
        template: updater-deployment.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
        template: updater-deployment.yaml

  - it: does not render a strategy block by default
    asserts:
      - notExists:
          path: spec.strategy
        template: updater-deployment.yaml

  - it: renders updater.strategy on the updater Deployment when set
    set:
      updater.strategy:
        type: RollingUpdate
        rollingUpdate:
          maxSurge: 0
          maxUnavailable: 1
    asserts:
      - equal:
          path: spec.strategy.type
          value: RollingUpdate
        template: updater-deployment.yaml
      - equal:
          path: spec.strategy.rollingUpdate.maxUnavailable
          value: 1
        template: updater-deployment.yaml

  - it: renders the Recreate strategy type
    set:
      updater.strategy.type: Recreate
    asserts:
      - equal:
          path: spec.strategy
          value:
            type: Recreate
        template: updater-deployment.yaml
