suite: service account names

tests:
  - it: uses the default admission controller service account name
    template: admission-controller-serviceaccount.yaml
    asserts:
      - equal:
          path: metadata.name
          value: RELEASE-NAME-vertical-pod-autoscaler-admission-controller

  - it: does not create an admission controller service account with a custom name
    template: admission-controller-serviceaccount.yaml
    set:
      admissionController.serviceAccount.name: custom-admission-sa
    asserts:
      - hasDocuments:
          count: 0

  - it: uses the custom admission controller service account in the deployment
    template: admission-controller-deployment.yaml
    set:
      admissionController.serviceAccount.name: custom-admission-sa
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: custom-admission-sa

  - it: uses the default recommender service account name
    template: recommender-serviceaccount.yaml
    asserts:
      - equal:
          path: metadata.name
          value: RELEASE-NAME-vertical-pod-autoscaler-recommender

  - it: does not create a recommender service account with a custom name
    template: recommender-serviceaccount.yaml
    set:
      recommender.serviceAccount.name: custom-recommender-sa
    asserts:
      - hasDocuments:
          count: 0

  - it: uses the custom recommender service account in the deployment
    template: recommender-deployment.yaml
    set:
      recommender.serviceAccount.name: custom-recommender-sa
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: custom-recommender-sa

  - it: uses the default updater service account name
    template: updater-serviceaccount.yaml
    asserts:
      - equal:
          path: metadata.name
          value: RELEASE-NAME-vertical-pod-autoscaler-updater

  - it: does not create an updater service account with a custom name
    template: updater-serviceaccount.yaml
    set:
      updater.serviceAccount.name: custom-updater-sa
    asserts:
      - hasDocuments:
          count: 0

  - it: uses the custom updater service account in the deployment
    template: updater-deployment.yaml
    set:
      updater.serviceAccount.name: custom-updater-sa
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: custom-updater-sa

  - it: uses the custom admission controller service account in RBAC
    template: admission-controller-clusterrolebinding.yaml
    set:
      admissionController.serviceAccount.name: custom-admission-sa
    asserts:
      - equal:
          path: subjects[0].name
          value: custom-admission-sa

  - it: uses the custom recommender service account in RBAC
    template: recommender-clusterrolebindings.yaml
    set:
      recommender.serviceAccount.name: custom-recommender-sa
    asserts:
      - contains:
          path: subjects
          content:
            name: custom-recommender-sa
            kind: ServiceAccount
            namespace: NAMESPACE

  - it: uses the custom updater service account in RBAC
    template: updater-clusterrolebinding.yaml
    set:
      updater.serviceAccount.name: custom-updater-sa
    asserts:
      - contains:
          path: subjects
          content:
            name: custom-updater-sa
            kind: ServiceAccount
            namespace: NAMESPACE

  - it: uses the custom recommender service account in leader election RBAC
    template: recommender-leader-election-rbac.yaml
    set:
      recommender.serviceAccount.name: custom-recommender-sa
    documentSelector:
      path: kind
      value: RoleBinding
    asserts:
      - equal:
          path: subjects[0].name
          value: custom-recommender-sa

  - it: uses the custom updater service account in leader election RBAC
    template: updater-rolebinding.yaml
    set:
      updater.serviceAccount.name: custom-updater-sa
    asserts:
      - equal:
          path: subjects[0].name
          value: custom-updater-sa
