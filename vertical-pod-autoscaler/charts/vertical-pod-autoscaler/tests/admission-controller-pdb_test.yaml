suite: admission-controller pdb - unhealthyPodEvictionPolicy
templates:
  - admission-controller-pdb.yaml
tests:
  - it: sets unhealthyPodEvictionPolicy to AlwaysAllow by default
    asserts:
      - equal:
          path: spec.unhealthyPodEvictionPolicy
          value: AlwaysAllow

  - it: sets unhealthyPodEvictionPolicy to IfHealthyBudget when configured
    set:
      admissionController.podDisruptionBudget.unhealthyPodEvictionPolicy: IfHealthyBudget
    asserts:
      - equal:
          path: spec.unhealthyPodEvictionPolicy
          value: IfHealthyBudget

  - it: omits unhealthyPodEvictionPolicy when set to null
    set:
      admissionController.podDisruptionBudget.unhealthyPodEvictionPolicy: null
    asserts:
      - notExists:
          path: spec.unhealthyPodEvictionPolicy
