suite: update strategy
templates:
  - admission-controller-deployment.yaml
  - recommender-deployment.yaml

tests:
  - it: should not render admission controller strategy by default
    template: admission-controller-deployment.yaml
    asserts:
      - notExists:
          path: spec.strategy

  - it: should render custom admission controller strategy
    template: admission-controller-deployment.yaml
    set:
      admissionController.updateStrategy.type: Recreate
    asserts:
      - equal:
          path: spec.strategy.type
          value: Recreate

  - it: should render custom admission controller rolling update strategy
    template: admission-controller-deployment.yaml
    set:
      admissionController.updateStrategy.type: RollingUpdate
      admissionController.updateStrategy.rollingUpdate.maxUnavailable: 1
    asserts:
      - equal:
          path: spec.strategy.type
          value: RollingUpdate
      - equal:
          path: spec.strategy.rollingUpdate.maxUnavailable
          value: 1

  - it: should not render recommender strategy by default
    template: recommender-deployment.yaml
    asserts:
      - notExists:
          path: spec.strategy

  - it: should render custom recommender strategy
    template: recommender-deployment.yaml
    set:
      recommender.updateStrategy.type: Recreate
    asserts:
      - equal:
          path: spec.strategy.type
          value: Recreate
