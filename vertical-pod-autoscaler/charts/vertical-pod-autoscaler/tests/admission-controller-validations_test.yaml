suite: admission controller TLS validations
templates:
  - admission-controller-validations.yaml
  - admission-controller-deployment.yaml
tests:
  - it: rejects configuration with no TLS certificate source
    template: admission-controller-validations.yaml
    set:
      admissionController.registerWebhook: false
      admissionController.certGen.enabled: false
      admissionController.certManager.enabled: false
    asserts:
      - failedTemplate:
          errorMessage: "admissionController requires a TLS certificate source. Enable certGen, certManager, or registerWebhook."

  - it: accepts certGen as the only TLS certificate source
    template: admission-controller-deployment.yaml
    set:
      admissionController.registerWebhook: false
      admissionController.certGen.enabled: true
      admissionController.certManager.enabled: false
    asserts:
      - isKind:
          of: Deployment

  - it: accepts registerWebhook as the only TLS certificate source
    template: admission-controller-deployment.yaml
    set:
      admissionController.registerWebhook: true
      admissionController.certGen.enabled: false
      admissionController.certManager.enabled: false
    asserts:
      - isKind:
          of: Deployment

  - it: accepts certManager as the only TLS certificate source
    template: admission-controller-deployment.yaml
    set:
      admissionController.registerWebhook: false
      admissionController.certGen.enabled: false
      admissionController.certManager.enabled: true
      admissionController.certManager.createSelfSignedIssuer.enabled: true
    asserts:
      - isKind:
          of: Deployment

  - it: rejects certManager together with registerWebhook
    template: admission-controller-validations.yaml
    set:
      admissionController.registerWebhook: true
      admissionController.certGen.enabled: false
      admissionController.certManager.enabled: true
      admissionController.certManager.createSelfSignedIssuer.enabled: true
    asserts:
      - failedTemplate:
          errorMessage: "admissionController.certManager.enabled and admissionController.registerWebhook cannot both be true. Set admissionController.registerWebhook: false when using cert-manager."
