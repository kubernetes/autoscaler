suite: container probes
templates:
  - admission-controller-deployment.yaml
  - recommender-deployment.yaml
  - updater-deployment.yaml
tests:
  - it: renders the default liveness and readiness probes and no startup probe
    asserts:
      - equal:
          path: spec.template.spec.containers[0].livenessProbe
          value:
            httpGet:
              path: /health-check
              port: prometheus
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
      - equal:
          path: spec.template.spec.containers[0].readinessProbe
          value:
            httpGet:
              path: /health-check
              port: prometheus
              scheme: HTTP
            periodSeconds: 10
            failureThreshold: 3
      - notExists:
          path: spec.template.spec.containers[0].startupProbe

  - it: adds a startup probe only to the component it is set for
    set:
      recommender.startupProbe:
        httpGet:
          path: /health-check
          port: prometheus
        periodSeconds: 10
        failureThreshold: 30
    asserts:
      - equal:
          path: spec.template.spec.containers[0].startupProbe
          value:
            httpGet:
              path: /health-check
              port: prometheus
            periodSeconds: 10
            failureThreshold: 30
        template: recommender-deployment.yaml
      - notExists:
          path: spec.template.spec.containers[0].startupProbe
        template: updater-deployment.yaml
      - notExists:
          path: spec.template.spec.containers[0].startupProbe
        template: admission-controller-deployment.yaml

  - it: merges a single overridden field into the default probe
    set:
      updater.livenessProbe.initialDelaySeconds: 30
    template: updater-deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.initialDelaySeconds
          value: 30
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.path
          value: /health-check

  - it: removes a probe that is set to null
    set:
      admissionController.readinessProbe: null
    template: admission-controller-deployment.yaml
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].readinessProbe
      - exists:
          path: spec.template.spec.containers[0].livenessProbe
