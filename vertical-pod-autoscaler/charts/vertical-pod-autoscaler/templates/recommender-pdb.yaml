{{- if and (.Values.recommender.enabled) .Values.recommender.podDisruptionBudget.enabled -}}
{{- $pdb := .Values.recommender.podDisruptionBudget -}}
{{- $hasMin := not (kindIs "invalid" $pdb.minAvailable) -}}
{{- $hasMax := not (kindIs "invalid" $pdb.maxUnavailable) -}}
{{- if and $hasMin $hasMax }}
    {{- fail "Only one of recommender.podDisruptionBudget.minAvailable or recommender.podDisruptionBudget.maxUnavailable should be set." }}
{{- end }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "vertical-pod-autoscaler.recommender.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vertical-pod-autoscaler.recommender.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "vertical-pod-autoscaler.recommender.selectorLabels" . | nindent 6 }}
  {{- if $hasMin }}
  minAvailable: {{ $pdb.minAvailable }}
  {{- end }}
  {{- if $hasMax }}
  maxUnavailable: {{ $pdb.maxUnavailable }}
  {{- end }}
{{- end -}}
