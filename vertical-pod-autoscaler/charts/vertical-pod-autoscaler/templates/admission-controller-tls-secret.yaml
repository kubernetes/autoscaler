{{- if and .Values.admissionController.enabled .Values.admissionController.tls.create }}
{{- $_ := include "vertical-pod-autoscaler.admissionController.tls.data" . }}
{{- $data := .Values.admissionController.tls._data }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "vertical-pod-autoscaler.admissionController.tls.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vertical-pod-autoscaler.admissionController.labels" . | nindent 4 }}
type: Opaque
data:
  ca: {{ $data.ca | quote }}
  cert: {{ $data.cert | quote }}
  key: {{ $data.key | quote }}
{{- end }}
