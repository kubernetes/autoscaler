{{- if and .Values.crds.enabled .Values.crds.migrationJob.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "vertical-pod-autoscaler.crds.migrationJob.fullname" . }}
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": pre-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
    "helm.sh/hook-weight": "-10"
  labels:
    {{- include "vertical-pod-autoscaler.crds.migrationJob.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "vertical-pod-autoscaler.crds.migrationJob.fullname" . }}
  annotations:
    "helm.sh/hook": pre-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
    "helm.sh/hook-weight": "-10"
  labels:
    {{- include "vertical-pod-autoscaler.crds.migrationJob.labels" . | nindent 4 }}
rules:
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    resourceNames:
      - verticalpodautoscalercheckpoints.autoscaling.k8s.io
      - verticalpodautoscalers.autoscaling.k8s.io
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "vertical-pod-autoscaler.crds.migrationJob.fullname" . }}
  annotations:
    "helm.sh/hook": pre-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
    "helm.sh/hook-weight": "-10"
  labels:
    {{- include "vertical-pod-autoscaler.crds.migrationJob.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "vertical-pod-autoscaler.crds.migrationJob.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "vertical-pod-autoscaler.crds.migrationJob.fullname" . }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "vertical-pod-autoscaler.crds.migrationJob.fullname" . }}
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": pre-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
    "helm.sh/hook-weight": "-5"
  labels:
    {{- include "vertical-pod-autoscaler.crds.migrationJob.labels" . | nindent 4 }}
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 3
  template:
    metadata:
      name: {{ include "vertical-pod-autoscaler.crds.migrationJob.fullname" . }}
      labels:
        {{- include "vertical-pod-autoscaler.crds.migrationJob.labels" . | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ include "vertical-pod-autoscaler.crds.migrationJob.fullname" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      containers:
        - name: fix-crd-ownership
          image: >-
            {{ .Values.crds.migrationJob.image.registry }}/{{ .Values.crds.migrationJob.image.repository }}:{{ .Values.crds.migrationJob.image.tag }}
          imagePullPolicy: {{ .Values.crds.migrationJob.image.pullPolicy }}
          command:
            - /bin/sh
            - -c
            - |
              set -e
              for crd in verticalpodautoscalercheckpoints.autoscaling.k8s.io verticalpodautoscalers.autoscaling.k8s.io; do
                kubectl label crd "$crd" app.kubernetes.io/managed-by=Helm --overwrite
                kubectl annotate crd "$crd" \
                  meta.helm.sh/release-name={{ .Release.Name }} \
                  meta.helm.sh/release-namespace={{ .Release.Namespace }} \
                  --overwrite
              done
{{- end }}
