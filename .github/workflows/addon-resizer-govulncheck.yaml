name: Addon Resizer govulncheck

on:
  schedule:
    # Mondays 06:17 UTC, so new advisories show up without waiting for a change.
    - cron: '17 6 * * 1'
  workflow_dispatch:
  pull_request:
    paths:
      - 'addon-resizer/go.mod'
      - 'addon-resizer/go.sum'
      - '.github/workflows/addon-resizer-govulncheck.yaml'

permissions:
  contents: read

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # The image is built with golang:1.26 (see addon-resizer/Dockerfile), the
          # latest 1.26 patch release, so check the standard library at that version.
          go-version: '1.26'
          check-latest: true
          cache-dependency-path: 'addon-resizer/go.sum'

      - name: govulncheck
        working-directory: addon-resizer
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
