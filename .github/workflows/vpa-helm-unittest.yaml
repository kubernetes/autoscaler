name: VPA Helm Unit Tests

on:
  push:
    paths:
      - 'vertical-pod-autoscaler/charts/**'
  pull_request:
    paths:
      - 'vertical-pod-autoscaler/charts/**'

permissions:
  contents: read

jobs:
  helm-unittest:
    name: Run Helm unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Not needed: this job only reads the repo and never pushes, so don't
          # leave the GITHUB_TOKEN on disk for later steps.
          persist-credentials: false
      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: Set up helm-unittest
        run: helm plugin install https://github.com/helm-unittest/helm-unittest.git --version 1.2.0 --verify=false
      - name: Run Helm unit tests for VPA
        run: helm unittest vertical-pod-autoscaler/charts/vertical-pod-autoscaler
