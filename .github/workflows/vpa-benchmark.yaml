name: Vertical Pod Autoscaler

on:
  pull_request:
    paths:
      - 'vertical-pod-autoscaler/**'
      - '!vertical-pod-autoscaler/**/*.md'
      - '.github/workflows/vpa-benchmark.yaml'

permissions:
  contents: read

jobs:
  benchmark:
    name: Go Benchmarks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: pr
          # Not needed: this job only reads the repo and never pushes.
          persist-credentials: false

      - name: Checkout Base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          path: base
          # Not needed: this job only reads the repo and never pushes.
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: pr/vertical-pod-autoscaler/go.mod
          cache-dependency-path: pr/vertical-pod-autoscaler/go.sum

      - name: Run Benchmarks (base and PR interleaved)
        shell: bash
        run: |
          # Run one count at a time, alternating between base and PR, so both sides see
          # the same runner conditions. Running all of base and then all of PR lets a slow
          # period on the runner land on one side only.
          # Only packages that contain benchmarks are run, so each round does not have to
          # start every test binary.
          bench_pkgs() {
            (
              cd "$1/vertical-pod-autoscaler"
              go list -f '{{.ImportPath}} {{.Dir}}' ./... | while read -r pkg dir; do
                if grep -qsE '^func Benchmark' "$dir"/*_test.go; then echo "$pkg"; fi
              done
            )
          }
          declare -A pkgs
          pkgs[base]=$(bench_pkgs base)
          pkgs[pr]=$(bench_pkgs pr)

          for i in $(seq 10); do
            if (( i % 2 )); then sides="base pr"; else sides="pr base"; fi
            for side in $sides; do
              (
                cd "$side/vertical-pod-autoscaler"
                go test -run='^$' -bench=. -count=1 ${pkgs[$side]}
              ) | tee -a "$side.txt"
            done
          done

      - name: Install benchstat
        run: go install golang.org/x/perf/cmd/benchstat@v0.0.0-20260813145340-fd4a688df892

      - name: Compare Results
        shell: bash
        run: |
          echo "### Vertical Pod Autoscaler Benchmark Results" >> $GITHUB_STEP_SUMMARY
          echo "Comparing PR branch against \`"$GITHUB_BASE_REF"\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -s base.txt ] && [ -s pr.txt ]; then
            echo '```' >> $GITHUB_STEP_SUMMARY
            $(go env GOPATH)/bin/benchstat base.txt pr.txt | tee benchstat.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          
            # Fail if any regression is >= 10%
            grep -qE '\+[1-9][0-9].*%' benchstat.txt && { echo "Regression detected >= 10%"; exit 1; } || true
          else
            echo "Error: Benchmark results not found or empty." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
