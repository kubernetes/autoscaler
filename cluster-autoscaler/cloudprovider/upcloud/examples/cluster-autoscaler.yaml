apiVersion: apps/v1
kind: Deployment
metadata:
  name: cluster-autoscaler
  namespace: kube-system
  labels:
    app: cluster-autoscaler
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cluster-autoscaler
  template:
    metadata:
      labels:
        app: cluster-autoscaler
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534 # Nobody.
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: cluster-autoscaler
      priorityClassName: system-cluster-critical
      containers:
        - name: cluster-autoscaler
          image: ghcr.io/upcloudltd/autoscaler:v1.29.5
          imagePullPolicy: "Always"
          resources:
            limits:
              cpu: 100m
              memory: 300Mi
            requests:
              cpu: 100m
              memory: 300Mi
          command:
            - /cluster-autoscaler
            - --cloud-provider=upcloud
            - --stderrthreshold=info
            - --scale-down-enabled=true
            - --v=4
          env:
            - name: UPCLOUD_CLUSTER_ID
              value: "${UPCLOUD_CLUSTER_ID}"
            - name: UPCLOUD_TOKEN
              valueFrom:
                secretKeyRef:
                  name: upcloud-autoscaler
                  key: token
                  optional: true
            - name: UPCLOUD_USERNAME
              valueFrom:
                secretKeyRef:
                  name: upcloud-autoscaler
                  key: username
                  optional: true
            - name: UPCLOUD_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: upcloud-autoscaler
                  key: password
                  optional: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: ssl-certs
              mountPath: /etc/ssl/certs/ca-certificates.crt
              readOnly: true
      volumes:
        - name: ssl-certs
          hostPath:
            path: "/etc/ssl/certs/ca-certificates.crt"
